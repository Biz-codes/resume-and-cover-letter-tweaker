# Runs scripts/check.sh, the same checks as the git pre-commit hook, on every push and pull
# request, so commits that skip the hook (such as VS Code's commit box) are checked too.
# Needs no secrets: nothing in the checks calls Claude or reads db/seed_personal/.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: resume_tweaker
        # Port 5433, as on the Mac, so check.sh and the .env.example URLs work unchanged.
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Read by the Postgres tools and by psycopg, which leave them out of the URLs.
      PGHOST: localhost
      PGPORT: "5433"
      PGUSER: postgres
      DATABASE_URL: postgresql+psycopg://localhost:5433/resume_tweaker
      TEST_DATABASE_URL: postgresql+psycopg://localhost:5433/resume_tweaker_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend packages
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install front end packages
        working-directory: frontend
        run: npm ci

      # The tests rebuild the test database's schema themselves; alembic check compares the
      # models with the app database, so that one needs the migrations applied first.
      - name: Set up the databases
        working-directory: backend
        run: |
          createdb resume_tweaker_test
          .venv/bin/alembic upgrade head

      - name: Run every check
        run: scripts/check.sh
